# Maintenance mode for eedresearch.com.
# Dropped into /etc/apache2/eed-maintenance/ to take the site off the public
# internet; moved out again (to ../eed-maintenance-off/) to restore it.
# The vhosts pick it up via IncludeOptional, so no vhost edits are needed to toggle.

Alias /maintenance /var/www/maintenance
<Directory /var/www/maintenance>
  Require all granted
</Directory>

# Keep the maintenance page itself out of the reverse proxy.
ProxyPass /maintenance !

ErrorDocument 503 /maintenance/index.html
Header always set Retry-After "3600"

# Every request except the maintenance assets gets a 503. 503 (not 404/410)
# is what tells search engines this is temporary, so rankings are preserved.
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/maintenance/
RewriteRule ^ - [R=503,L]
