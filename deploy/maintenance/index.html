<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Under Maintenance — EED Research Institute</title>
<link rel="icon" href="/maintenance/logo.png">
<style>
  :root{
    --paper:#FAF9F6;
    --ink:#000;
    --ink-faint:#697068;
    --rule:#E2E0D8;
    --green-700:#0C7743;
    --gold-600:#89692f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:48px 16px;
    line-height:1.6;
  }
  main{max-width:34rem;width:100%}
  img{height:52px;width:auto;display:block;margin-bottom:40px}
  .eyebrow{
    font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;
    color:var(--gold-600);margin:0 0 14px;
  }
  h1{
    font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15;
    font-weight:600;letter-spacing:-.02em;margin:0 0 20px;
  }
  p{margin:0 0 18px;color:var(--ink-faint);font-size:1.05rem}
  hr{border:0;border-top:1px solid var(--rule);margin:36px 0 20px}
  .contact{font-size:.95rem;color:var(--ink-faint)}
  a{color:var(--green-700);text-decoration:none;border-bottom:1px solid currentColor}
  a:hover{color:#063321}
</style>
</head>
<body>
<main>
  <img src="/maintenance/logo.png" alt="EED Research Institute">
  <p class="eyebrow">Temporarily offline</p>
  <h1>We&rsquo;re carrying out some maintenance.</h1>
  <p>The site is briefly unavailable while we make a few improvements. It will be back shortly &mdash; thank you for your patience.</p>
  <hr>
  <p class="contact">Need to reach us in the meantime? <a href="mailto:eri@eedadvisory.com">eri@eedadvisory.com</a></p>
</main>
</body>
</html>
